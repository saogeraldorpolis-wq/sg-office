<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Selo premium — badge navy com filete dourado, monograma claro (ícone do app) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16466e"/>
      <stop offset=".55" stop-color="#0e3050"/>
      <stop offset="1" stop-color="#081e33"/>
    </linearGradient>
    <linearGradient id="letra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9dcec"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7cf8f"/>
      <stop offset="1" stop-color="#b28a2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none"
        stroke="url(#ouro)" stroke-width="7" opacity=".9"/>
  <text x="256" y="296" text-anchor="middle"
        font-family="Cinzel, 'Playfair Display', Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="228" letter-spacing="-16"
        fill="url(#letra)">SG</text>
  <rect x="168" y="322" width="176" height="3" rx="1.5" fill="url(#ouro)" opacity=".95"/>
  <text x="256" y="388" text-anchor="middle"
        font-family="'Segoe UI', Inter, Arial, sans-serif"
        font-weight="600" font-size="44" letter-spacing="13"
        fill="#e7cf8f">OFFICE</text>
</svg>
